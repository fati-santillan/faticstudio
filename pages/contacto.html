<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatic Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>
    <header>
        <section>
            <div class="encabezado">
                <h1>Fatic Studio</h1>
            </div>
        </section>
        
        <nav class="navbar navbar-expand-lg w-100">
            <div class="container-fluid">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-center" id="navbarNavAltMarkup">
                    <div class="navbar-nav">
                        <a class="nav-link linknav" aria-current="page" href="../index.html">Inicio</a>
                        <a class="nav-link linknav" href="productos.html">Productos</a>
                        <a class="nav-link linknav" href="quienes_somos.html">Quienes Somos</a>
                        <a class="nav-link linknav" href="#">Contacto</a>
                        <a class="nav-link linknav" href="preguntas_frecuentes.html">Preguntas frecuentes</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="container contacto">
            <div class="row">
                <h2 class="col-12">También podes mandarnos un mensaje a través de nuestras redes sociales</h2>
            </div> 
        
            <form class="contacto w-50 m-auto">
                <div class="mb-3">
                    <label for="name" class="form-label">Nombre y Apellido</label>
                    <input type="text" class="form-control" id="name" aria-describedby="emailHelp">
                </div>
                <div class="mb-3">
                    <label for="mail" class="form-label">Correo electronico</label>
                    <input type="email" class="form-control" id="mail" aria-describedby="emailHelp">
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">Dejanos tu consulta</label>
                    <input type="text" class="form-control" id="message">
                </div>
                <button type="submit" class="btn btn-clarito">Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <section class="contenedor-footer">
            <div>
                <h3>Categorías</h3>
                <ul>
                    <li><a href="productos.html">Productos</a></li>
                    <li><a href="quienes_somos.html">Quienes somos</a></li>
                    <li><a href="#">Contacto</a></li>
                    <li><a href="preguntas_frecuentes.html">Preguntas frecuentes</a></li>
                </ul>
            </div>
           
            <div>
                <h3>Redes sociales</h3>
                <ul class="redes"> 
                    <li><a href="#"><img src="../assets/iconos/icono instagram.png" alt="Instagram"></img></a></li>
                    <li><a href="#"><img src="../assets/iconos/icono facebook.png" alt="Facebook"></img></a></li>
                    <li><a href="#"><img src="../assets/iconos/icono whastapp.png" alt="Whastapp"></img></a></li>
                </ul>
            </div>
        </section>

       <div>
         <p>Creado por Fatima Camila Santillan - 2026</p>
       </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
